# Copy this file to config.toml only when no local configuration exists.
# Choose another model if this model is unavailable for your account.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[tui]
status_line = ["approval-mode", "model-with-reasoning", "context-used", "context-window-size", "used-tokens", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true

[features]
memories = true
